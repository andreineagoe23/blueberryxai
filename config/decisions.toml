# Human decisions for the 2025 section E roll-forward, read by the program.
#
# Every decision says what was decided, on which source, why, and by whom.
# A decision with `observed` values only applies while the inputs still show exactly
# those values. If the workbook changes (for example another version of
# registru_2025.xlsx), the decision does not apply, the conflict reopens and the text
# shows a gap. A decision can never be carried silently onto data it was not made on.
#
# Values in `observed` are exact amounts in lei (ratios as fractions), as strings for Decimal.
# Text fields are in Romanian: they are copied into output/probleme_E_{year}.md for the CFO's team.

[meta]
reporting_year = 2025
prepared_by = "Andrei Neagoe (BlueberryX)"
prepared_on = "2026-10-23"
status = "proiect: de confirmat de directorul financiar și de funcția actuarială înainte de transmitere"

# ---------------------------------------------------------------------------
# Policies: standing rules that apply to every figure, every year.
# ---------------------------------------------------------------------------

[[policy]]
id = "no-prior-year-substitution"
rule = "O cifră lipsă din anul curent nu se înlocuiește niciodată cu cea de anul trecut. Devine un loc de completat vizibil."
reason = "Regula 1 a raportului. Emailul directorului financiar (punctul 2) cere contrariul; cererea e refuzată și apare în lista de probleme."
source = "README §4 regula 1; email_director_financiar.txt punctul 2"

[[policy]]
id = "no-silent-precedence"
rule = "Când două surse dau valori diferite pentru aceeași cifră, niciuna nu câștigă implicit. Cifra rămâne în conflict până o rezolvă o decizie de mai jos."
reason = "O regulă de prioritate aplicată automat este o alegere tăcută; cine semnează trebuie să vadă fiecare neconcordanță."
source = "README §5 livrabilul 2"

[[policy]]
id = "hidden-sheets-are-not-sources"
rule = "Foile ascunse sunt citite doar ca să se raporteze că au fost ignorate."
reason = "registru_2025.xlsx conține foaia ascunsă «Capital_vechi», cu titlul «NU SE FOLOSEȘTE (copie 2024)» și valorile din 2024."
source = "registru_2025.xlsx, foaia Capital_vechi, A1"

[[policy]]
id = "explanations-need-evidence"
rule = "O frază care afirmă o direcție sau o cauză apare doar dacă se sprijină pe o comparație calculată (direcția) sau pe o dovadă aprobată mai jos (cauza)."
reason = "Regula 2 a raportului."
source = "README §4 regula 2"

# ---------------------------------------------------------------------------
# Figure decisions
# ---------------------------------------------------------------------------

[[decision]]
id = "solvency-ratio-2025"
figure = "solvency_ratio"
choice = "computed"
computed_from = ["own_funds_total", "scr"]
rejected = "celula introdusă în foaia Capital (eticheta «Rata de solvabilitate»)"
observed = { solvency_ratio_reported = "1.874", own_funds_total = "293699300", scr = "148763200" }
reason = """
Rata introdusă în registru (187,4 %) este identică cu cea din 2024, în timp ce aceeași foaie dă fonduri
proprii eligibile de 293.699,3 mii lei și un SCR de 148.763,2 mii lei, adică 197,4 %. Rata este, prin
definiție, fondurile proprii eligibile împărțite la SCR, iar ambele intrări trec propriile verificări
(nivelurile se adună la total; SCR este același cu cel din foaia SCR_module). Celula introdusă este deci
considerată neactualizată din 2024 și se folosește valoarea calculată, rotunjită o singură dată din
câtul nerotunjit.
"""
source = "registru_2025.xlsx, foaia Capital: rândurile fonduri proprii total, SCR, rata de solvabilitate"
decided_by = "Andrei Neagoe (propunere), de confirmat de directorul financiar"
decided_on = "2026-10-23"

# ---------------------------------------------------------------------------
# Evidence: statements taken from the company's documents. The program checks that
# each quote occurs verbatim in the named document before using it.
# ---------------------------------------------------------------------------

[[evidence]]
id = "scr-change-cause"
claim = "SCR a scăzut în 2025, în principal din cauza scăderii riscului de piață."
document = "nota_functia_actuariala_2026-02-02.docx"
location = "paragraful 1"
quote = "Cerința de capital de solvabilitate a scăzut la 31 decembrie 2025 față de anul anterior, în principal ca urmare a scăderii riscului de piață."
reason = "Nota funcției actuariale este singurul document al Societății care explică variația SCR; registrul o confirmă (riscul de piață scade de la 58,3 la 41,9 mil. lei)."
# Used only as the cause of a computed fall of `explains`; `clause` must be part of the quote.
explains = "scr"
direction = "down"
clause = "în principal ca urmare a scăderii riscului de piață"
approved_by = "Andrei Neagoe (propunere), de confirmat de funcția actuarială"

[[evidence]]
id = "standard-formula"
claim = "SCR se calculează cu formula standard, fără parametri specifici proprii."
document = "nota_functia_actuariala_2026-02-02.docx"
location = "paragraful 5"
quote = "Calculele folosesc formula standard. Societatea nu utilizează parametri specifici proprii."
reason = "Confirmă pentru 2025 fraza din raportul 2024 despre metoda de calcul."
approved_by = "Andrei Neagoe (propunere), de confirmat de funcția actuarială"

[[evidence]]
id = "mcr-pending"
claim = "Calculul MCR nu era finalizat la data notei."
document = "nota_functia_actuariala_2026-02-02.docx"
location = "paragraful 4"
quote = "Calculul cerinței de capital minim este în curs de finalizare și va fi transmis separat."
reason = "Explică de ce registrul nu are MCR; se citează în motivul locului de completat."
# Cited as the reason of the gap while the workbook has no MCR, under the name `cited_as`.
explains_gap = "mcr"
cited_as = "nota funcției actuariale din 02.02.2026"
approved_by = "Andrei Neagoe"

[[evidence]]
id = "dividends-paid-2025"
claim = "În 2025 s-au plătit dividende de 15.000.000 lei."
document = "situatii_financiare_2025_extras.pdf"
location = "Indicatori selectați"
quote = "(15.000.000)"
reason = "Cifră contabilă: sursa este situațiile financiare auditate (emailul directorului financiar, punctul 5), confirmată de hotărârea AGA."
# The quote must be the first amount after this label on the page, and equal value_lei.
label = "Dividende plătite"
figure = "dividends"
value_lei = "15000000"
corroborated_by = { document = "proces_verbal_AGA_2025-04-24.txt", location = "punctul 3", quote = "distribuirea de dividende în valoare totală de 15.000.000 lei" }
approved_by = "Andrei Neagoe (propunere), de confirmat de directorul financiar"

[[evidence]]
id = "dividend-policy"
claim = "Politica de dividende aprobată de Consiliul de Administrație rămâne neschimbată."
document = "proces_verbal_AGA_2025-04-24.txt"
location = "punctul 4"
quote = "politica de dividende aprobată de Consiliul de Administrație în 2023 rămâne neschimbată"
reason = "Susține clauza «conform politicii de dividende aprobate de Consiliul de Administrație» pentru 2025."
approved_by = "Andrei Neagoe"

# Statements explicitly rejected, kept so the issues report can show why they are absent.

[[rejected_claim]]
id = "prior-year-figure-for-missing"
claim = "Unde lipsește o cifră, se pune cea de anul trecut."
requested_by = "email_director_financiar.txt, punctul 2"
reason = "Regula 1 a raportului. Anul acesta lipsește MCR; cifra de anul trecut, 45,6 mil. lei, ar fi o cifră greșită prezentată ca fiind curentă. Textul arată în schimb un loc de completat (politica no-prior-year-substitution)."

[[rejected_claim]]
id = "reinsurance-improved-ratio"
claim = "Rata de solvabilitate s-a îmbunătățit datorită noului program de reasigurare."
requested_by = "email_director_financiar.txt, punctul 3"
contradicted_by = { document = "nota_functia_actuariala_2026-02-02.docx", location = "paragraful 3", quote = "Programul de reasigurare a fost reînnoit la 1 ianuarie 2025 în aceleași condiții ca în anul precedent." }
reason = "Funcția actuarială a Societății arată că programul a fost reînnoit în aceleași condiții, fără efect asupra SCR."
# The draft is checked not to contain these words.
forbidden_terms = ["program de reasigurare", "programul de reasigurare", "programului de reasigurare"]

[[rejected_claim]]
id = "wording-from-other-insurer"
claim = "Se preiau formulări din raportul Asigurări Dunărea."
requested_by = "email_director_financiar.txt, punctul 4"
reason = "Regula 4 a raportului: nu se refolosesc niciodată formulările altei companii."

