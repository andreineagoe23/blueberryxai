# --- Derived figures --------------------------------------------------------

[[derived]]
id = "solvency_ratio"
description = "Rata de solvabilitate = fonduri proprii eligibile / SCR"
numerator = "own_funds_total"
denominator = "scr"
reported = "solvency_ratio_reported"
tolerance = "ratio"

# --- Checks -----------------------------------------------------------------
# sum: the terms add up to `equals` within the tolerance. "-abs:x" subtracts |x|.
#      Terms listed in `optional` may be absent (the 2024 workbook has no tier 3 row).
#      taint_total: if a term is not ok, the total is not trusted either.
# range: min <= figure / of <= max.
# Every current-year figure is also compared with the same figure in last year's workbook:
# identical non-zero value = probably not updated; ratio outside run.toml magnitude = unit error.

[[check]]
id = "fonduri-proprii-niveluri"
description = "nivel 1 + nivel 2 + nivel 3 = total fonduri proprii eligibile"
type = "sum"
terms = ["own_funds_t1", "own_funds_t2", "own_funds_t3"]
optional = ["own_funds_t3"]
equals = "own_funds_total"
taint_total = true

[[check]]
id = "scr-doua-foi"
description = "SCR din foaia Capital = SCR din foaia SCR_module"
type = "sum"
terms = ["scr"]
equals = "scr_modules"

[[check]]
id = "scr-baza-din-module"
description = "subscriere + piață + contrapartidă − diversificare = SCR de bază"
type = "sum"
terms = ["scr_uw", "scr_mkt", "scr_cpty", "-abs:scr_div"]
equals = "bscr"

[[check]]
id = "scr-din-baza"
description = "SCR de bază + risc operațional = SCR (foaia SCR_module)"
type = "sum"
terms = ["bscr", "scr_op"]
equals = "scr_modules"

[[check]]
id = "mcr-coridor"
description = "MCR între 25 % și 45 % din SCR (coridorul Solvabilitate II)"
type = "range"
figure = "mcr"
of = "scr"
min = "0.25"
max = "0.45"
