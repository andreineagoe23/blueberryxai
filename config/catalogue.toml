# Figure catalogue for section E: what each figure is, not where it is.
#
# A figure is found by its label on a visible sheet, never by its coordinates.
# Labels are compared after normalisation (lowercase, no diacritics, punctuation as spaces),
# with or without a trailing parenthesis ("Efect de diversificare (se scade)"), and must match
# exactly: "SCR" does not match "SCR de bază". Exactly one matching row is required;
# none or several make the figure a gap, with the reason.
#
# kind: money = amount, scaled to lei with the sheet's unit; ratio = fraction (cell formatted as %).
# column: current = "31.12 an curent", prior = "31.12 an anterior" (see run.toml [columns]).

[sheets.capital]
names = ["Capital"]
titles = ["Fonduri proprii și cerințe de capital"]

[sheets.scr_module]
names = ["SCR_module"]
titles = ["Componentele SCR"]

